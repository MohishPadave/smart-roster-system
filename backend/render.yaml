databases:
  - name: smart-roster-db
    plan: free
    databaseName: smart_roster
    user: smart_roster_user

services:
  - type: web
    name: roster-solver
    runtime: python
    plan: free
    rootDir: backend/solver-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: roster-api
    runtime: node
    plan: free
    rootDir: backend/api
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run db:seed-if-empty && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-roster-db
          property: connectionString
      - key: SOLVER_URL
        fromService:
          type: web
          name: roster-solver
          property: url
      - key: AUTH_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
